syntax = "proto3";

package ics_common;

option csharp_namespace = "IcsCommon";

// ─── Enums ───────────────────────────────────────────────────────────────────

enum IcsStatusCode {
    // The numbers are the game executable's own (its IcsStatusCodeEnum, the ics_common.proto blob in the exe,
    // dumped in services/internal/ics/testdata/ics_status_codes_exe.txt). The names are kept. An error with a
    // number outside 10-127 (the repo's old 2xx ones) left the client's call pending until it expired.

    // Results (0-3)
    ICS_STATUS_CODE_SUCCESS                                      = 0;
    ICS_STATUS_CODE_ACKNOWLEDGED                                 = 1;
    ICS_STATUS_CODE_PENDING                                      = 2;
    ICS_STATUS_CODE_STREAM_FINISHED                              = 3;

    // Any error (10-127): the range the client treats as an error, fatal ones first (11-19)
    ICS_STATUS_CODE_ERROR_ANY_BEGIN                              = 10;
    ICS_STATUS_CODE_ERROR_FATAL_BEGIN                            = 11;
    ICS_STATUS_CODE_ERROR_FATAL_NO_CONNECTION                    = 12;
    ICS_STATUS_CODE_ERROR_FATAL_CALL_IS_DEAD                     = 13;
    ICS_STATUS_CODE_ERROR_FATAL_STREAM_IS_DEAD                   = 14;
    ICS_STATUS_CODE_ERROR_FATAL_END                              = 19;

    // General errors (20-99)
    ICS_STATUS_CODE_ERROR_BEGIN                                  = 20;
    ICS_STATUS_CODE_ERROR_INVALID_PROTO_VERSION                  = 21;
    ICS_STATUS_CODE_ERROR_INTERNAL_ERROR                         = 22;
    ICS_STATUS_CODE_ERROR_UNKNOWN_REQUEST                        = 23;
    ICS_STATUS_CODE_ERROR_INVALID_REQUEST                        = 24;
    ICS_STATUS_CODE_ERROR_REQUEST_FAILED                         = 25;
    ICS_STATUS_CODE_ERROR_REQUEST_TIMEOUT                        = 26;
    ICS_STATUS_CODE_ERROR_REQUEST_PENDING                        = 27;
    ICS_STATUS_CODE_ERROR_UNKNOWN_MESSAGE                        = 28;
    ICS_STATUS_CODE_ERROR_INVALID_MESSAGE                        = 29;
    ICS_STATUS_CODE_ERROR_DESERIALIZE_MESSAGE_FAILED             = 30;
    ICS_STATUS_CODE_ERROR_SERIALIZE_MESSAGE_FAILED               = 31;
    ICS_STATUS_CODE_ERROR_BROKER_RECEIVE_FAILED                  = 32;
    ICS_STATUS_CODE_ERROR_BROKER_SEND_FAILED                     = 33;
    ICS_STATUS_CODE_ERROR_FILE_OPERATION_FAILED                  = 34;
    ICS_STATUS_CODE_ERROR_FILE_OBJECT_NOT_FOUND                  = 35;
    ICS_STATUS_CODE_ERROR_DATABASE_OPERATION_FAILED              = 36;
    ICS_STATUS_CODE_ERROR_DATABASE_OBJECT_NOT_FOUND              = 37;
    ICS_STATUS_CODE_ERROR_KVSTORE_OPERATION_FAILED               = 38;
    ICS_STATUS_CODE_ERROR_KVSTORE_OBJECT_NOT_FOUND               = 39;
    ICS_STATUS_CODE_ERROR_AUTHENTICATION_FAILED                  = 40;
    ICS_STATUS_CODE_ERROR_PERMISSION_CHECK_FAILED                = 41;
    ICS_STATUS_CODE_ERROR_ACCOUNT_KICK_CHECK_FAILED              = 42;
    ICS_STATUS_CODE_ERROR_SESSION_CHECK_FAILED                   = 43;
    ICS_STATUS_CODE_ERROR_CAPACITY_CHECK_FAILED                  = 44;
    ICS_STATUS_CODE_ERROR_EXISTING_JOB_FOUND                     = 45;
    ICS_STATUS_CODE_ERROR_JOB_NOT_FOUND                          = 46;
    ICS_STATUS_CODE_ERROR_EXISTING_NAME_FOUND                    = 47;
    ICS_STATUS_CODE_ERROR_CHARACTER_COUNT_CHECK_FAILED           = 48;
    ICS_STATUS_CODE_ERROR_GATEWAY_RESERVATION_ADD_FAILED         = 49;
    ICS_STATUS_CODE_ERROR_PLAY_RESERVATION_NO_GATEWAY            = 50;
    ICS_STATUS_CODE_ERROR_PLAY_RESERVATION_NO_SERVER             = 51;
    ICS_STATUS_CODE_ERROR_EXPLOIT_ACCOUNT_IN_USE                 = 52;
    ICS_STATUS_CODE_ERROR_PLAYER_ONLINE_REC_NOT_FOUND            = 53;
    ICS_STATUS_CODE_ERROR_UNUSED_54                              = 54;
    ICS_STATUS_CODE_ERROR_UNUSED_55                              = 55;
    ICS_STATUS_CODE_ERROR_PLAYER_CHARACTER_CACHE_REC_NOT_FOUND   = 56;
    ICS_STATUS_CODE_ERROR_PLAYER_CHARACTER_MINI_REC_NOT_FOUND    = 57;
    ICS_STATUS_CODE_ERROR_ACCOUNT_REC_NOT_FOUND                  = 58;
    ICS_STATUS_CODE_ERROR_CHARACTER_REC_NOT_FOUND                = 59;
    ICS_STATUS_CODE_ERROR_CHARACTER_LIST_NOT_FOUND               = 60;
    ICS_STATUS_CODE_ERROR_GAME_BRANCH_INFO_REC_NOT_FOUND         = 61;
    ICS_STATUS_CODE_ERROR_SPM_FINDER_REC_NOT_FOUND               = 62;
    ICS_STATUS_CODE_ERROR_WORLD_CONFIG_REC_NOT_FOUND             = 63;
    ICS_STATUS_CODE_ERROR_WORLD_STATUS_REC_NOT_FOUND             = 64;
    ICS_STATUS_CODE_ERROR_WORLD_OFFLINE                          = 65;
    ICS_STATUS_CODE_ERROR_PLAY_RESERVATION_TIMEOUT               = 66;
    ICS_STATUS_CODE_ERROR_GAME_BRANCH_REC_EXISTS                 = 67;
    ICS_STATUS_CODE_ERROR_GAME_BRANCH_REC_NOT_FOUND              = 68;
    ICS_STATUS_CODE_ERROR_GAME_VERSION_REC_NOT_FOUND             = 69;
    ICS_STATUS_CODE_ERROR_GAME_PATCH_REC_NOT_FOUND               = 70;
    ICS_STATUS_CODE_ERROR_ESCROW_ACCOUNT_REC_NOT_FOUND           = 71;
    ICS_STATUS_CODE_ERROR_K8S_API_ERROR                          = 72;
    ICS_STATUS_CODE_ERROR_WORLD_OP_CONFLICT                      = 73;
    ICS_STATUS_CODE_ERROR_END                                    = 99;
// [CoA + C | Y | B]

    // Session termination errors (100-109)
    ICS_STATUS_CODE_ERROR_TERM_SESSION_BEGIN                     = 100;
    ICS_STATUS_CODE_ERROR_TERM_SESSION_ADMIN_KICK                = 101;
    ICS_STATUS_CODE_ERROR_TERM_SESSION_ACCOUNT_IN_USE            = 102;
    ICS_STATUS_CODE_ERROR_TERM_SESSION_ACCOUNT_OVERWRITE         = 103;
    ICS_STATUS_CODE_ERROR_TERM_SESSION_SESSION_COUNT_OVER_LIMIT  = 104;
    ICS_STATUS_CODE_ERROR_TERM_SESSION_SYSTEM_OVERLOAD           = 105;
    ICS_STATUS_CODE_ERROR_TERM_SESSION_END                       = 109;
    ICS_STATUS_CODE_ERROR_ANY_END                                = 127;
}

enum SessionRequestType {
    SESSION_REQUEST_TYPE_INVALID = 0;
    SESSION_REQUEST_TYPE_OPEN    = 1;
    SESSION_REQUEST_TYPE_CLOSE   = 2;
}

enum SystemEventType {
    SYSTEM_EVENT_TYPE_INVALID     = 0;
    SYSTEM_EVENT_TYPE_SESSION_END = 1;
}

// ─── Messages ────────────────────────────────────────────────────────────────

message TraceSample {
    int32             sample_index = 1;
    map<string, string> tags         = 2;
}

message SystemData {
    map<string, string>  tags          = 1;
    repeated TraceSample trace_samples = 2;
}

message MessageWrapper {
    SystemData    system_data       = 1;
    IcsStatusCode status_code       = 2;
    string        message_type_name = 3;
    bytes         message_data      = 4;
}

message MessageWrapperBatch {
    repeated MessageWrapper batch = 1;
}

message KeepAliveMessage {
    int64 timestamp_msec = 1;
}

message SessionRequest {
    SessionRequestType    request_type = 1;
    map<string, string>   tags         = 2;
    map<string, string>   data_map     = 3;
    string                data_string  = 4;
}

message SessionReply {
    IcsStatusCode         result_code  = 1;
    SessionRequestType    request_type = 2;
    map<string, string>   tags         = 3;
    map<string, string>   data_map     = 4;
    string                data_string  = 5;
}

message SystemEvent {
    IcsStatusCode         status_code = 1;
    SystemEventType       event_type  = 2;
    map<string, string>   tags        = 3;
}

message TestMessage {
    map<string, string> tags = 1;
}

message TraceMessage {
    map<string, string> tags    = 1;
    string              message = 2;
}
