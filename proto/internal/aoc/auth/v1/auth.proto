syntax = "proto3";

package aoc.auth.v1;

option go_package = "aocrop/services/gen/aoc/auth/v1;authv1";

// Internal: services resolve a launcher login token to its account.
service AuthService {
  // Unauthenticated when the token is unknown or expired.
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  int64 account_id = 1;
  string username = 2;
}
