syntax = "proto3";

package aoc.mesh.v1;

option go_package = "aocrop/services/gen/aoc/mesh/v1;meshv1";

// Internal: the registry of live world servers (worldd) and where characters
// play. Milestone A runs one world server; placement puts everyone on it.
service MeshService {
  // A world server announces itself at startup and gets its ServerId, which
  // it mints NetGUIDs under. Register always mints a new ServerId, so a
  // restarted worldd gets a new one. InvalidArgument for an address a game
  // client cannot dial: not host:port; a host that is neither an IP address
  // nor a plain ASCII host name (letters, digits, '.', '-', '_'); 0.0.0.0 or
  // :: (what a server binds, not what a client connects to); or a port
  // outside 1-65535.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Keeps a registration live. Send it every heartbeat_interval_ms.
  //
  // NotFound is the only answer that means the registry has forgotten this
  // server_id. Registering again yields a NEW ServerId, so the NetGUIDs minted
  // under the old one are dead: worldd must drop that state or exit, not
  // silently adopt the new id.
  //
  // Any other error (Unavailable while the mesh restarts, Internal on a
  // database blip, or the caller's own DeadlineExceeded) means retry Heartbeat
  // with backoff. Do not re-register: nothing says the registration is gone,
  // and the next heartbeat that succeeds revives it. After about three missed
  // heartbeats Place stops returning this server until one does.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // The world server a character should join. Unavailable when none is live,
  // with a google.rpc.ErrorInfo detail {reason: "NO_WORLD_SERVER", domain:
  // "mesh.aoc"}. grpc-go also answers Unavailable when mesh is not listening:
  // only that detail says there is no world server.
  rpc Place(PlaceRequest) returns (PlaceResponse);
}
// (C.O.A + Cyb)

message RegisterRequest {
  string address = 1; // host:port the game client connects to
  repeated string regions = 2; // regions the server owns (unused while N = 1)
}

message RegisterResponse {
  uint32 server_id = 1; // always >= 1: 0 is reserved for the static world
  int64 heartbeat_interval_ms = 2; // send a Heartbeat at least this often; always > 0
}

message HeartbeatRequest {
  uint32 server_id = 1;
}

message HeartbeatResponse {}

message PlaceRequest {
  string character_id = 1;
}

message PlaceResponse {
  uint32 server_id = 1; // 0 for the configured static world
  string address = 2; // host:port for the client's PlayReply
}
